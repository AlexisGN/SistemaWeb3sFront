<div class="admin-shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <button type="button" class="mobile-toggle" (click)="toggleMobileMenu()">
    ☰
  </button>

  <aside class="sidebar" [class.mobile-open]="mobileMenuOpen">
    <button type="button" class="sidebar-toggle" (click)="toggleSidebar()">
      {{ sidebarCollapsed ? '›' : '‹' }}
    </button>

    <div class="brand">
      <div class="brand-logo">
        <img src="/assets/images/logo-3s.png" alt="Sistema 3S" />
      </div>

      <div class="brand-text">
        <strong>Sistema 3S</strong>
        <span>Panel administrador</span>
      </div>
    </div>

    <nav class="menu-scroll">
      <section
        class="menu-group"
        *ngFor="let group of menuVisible; trackBy: trackByGroup"
      >
        <h3>{{ group.title }}</h3>

        <a
          *ngFor="let item of group.items; trackBy: trackByItem"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMobileMenu()"
        >
          <span class="menu-icon">{{ item.icon }}</span>
          <span class="menu-label">{{ item.label }}</span>
        </a>
      </section>
    </nav>

    <button type="button" class="logout-card" (click)="cerrarSesion()">
      <strong>3S</strong>
      <span>CERRAR SESIÓN</span>
    </button>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1>Panel administrador</h1>
        <p>Gestión comercial, inventario, operaciones y seguridad.</p>
      </div>

      <div class="topbar-actions">
        <div class="system-status" [ngClass]="estadoSistema">
          <span></span>
          {{ textoEstadoSistema }}
        </div>

        <div class="user-card">
          <strong>{{ usuarioRol || 'Usuario' }}</strong>
          <span>{{ usuarioCorreo || 'sesión activa' }}</span>
        </div>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
